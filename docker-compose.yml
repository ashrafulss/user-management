version: "3.8"

services:
  postgres_third:
    image: postgres:17.5-alpine
    container_name: user_module_db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sa
      - POSTGRES_DB=user_module_db
    volumes:
      # Added separate data directory so your user data doesn't get wiped out on restart
      - ./pgdata_third:/var/lib/postgresql/data